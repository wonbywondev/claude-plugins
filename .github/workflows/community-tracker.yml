name: community-tracker

# Tracks every plugin hosted in this repo that is listed in
# anthropics/claude-plugins-community marketplace. Per plugin:
#   - Resolves community-pinned SHA → plugin version
#   - Writes shields.io endpoint JSON for README badges
#   - Sends one ntfy push when the pin moves (deduplicated via state file)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: community-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Track community pins & update badges
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/community-tracker.sh

      - name: Commit state if changed
        run: |
          git config user.name "community-tracker-bot"
          git config user.email "community-tracker-bot@users.noreply.github.com"
          # Add all per-plugin state files matching the naming convention
          shopt -s nullglob
          FILES=( .github/state/*-sha.json .github/state/*-community-version.json )
          # Exclude the shared claude-code-releases.json (handled by upstream-watch)
          ADD=()
          for f in "${FILES[@]}"; do
            base=$(basename "$f")
            if [[ "$base" == "claude-code-releases.json" ]]; then
              continue
            fi
            ADD+=( "$f" )
          done
          if [[ ${#ADD[@]} -eq 0 ]]; then
            echo "no tracker state files to commit"
            exit 0
          fi
          git add "${ADD[@]}"
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "chore: update community tracker state"
          # Retry on push race (another workflow pushed mid-run)
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push race on attempt $attempt — pulling and retrying"
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts"
          exit 1
