name: upstream-watch

# Fetches Anthropic Claude Code release notes and writes one markdown file
# per release into upstream-updates/ with YAML frontmatter for lifecycle
# tracking (acknowledged / applied / impact / notes).

on:
  schedule:
    # Every 3 hours (00, 03, 06, 09, 12, 15, 18, 21 UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch new Claude Code releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fetch-new-releases.sh

      - name: Commit and push if files changed
        run: |
          git config user.name "upstream-watch-bot"
          git config user.email "upstream-watch-bot@users.noreply.github.com"
          git add upstream-updates/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          NEW_FILES=$(git diff --cached --name-only --diff-filter=A upstream-updates/ | sed 's|upstream-updates/||' | tr '\n' ' ')
          git commit -m "chore: add $NEW_FILES"
          git push
