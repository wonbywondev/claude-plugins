name: upstream-watch

# Maintains .github/state/claude-code-releases.json — a single JSON index of
# Anthropic Claude Code releases, used by each plugin's upstream-check hook
# to detect unreviewed releases.

on:
  schedule:
    # Every 3 hours (00, 03, 06, 09, 12, 15, 18, 21 UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch new Claude Code releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fetch-new-releases.sh

      - name: Commit and push if index changed
        run: |
          git config user.name "upstream-watch-bot"
          git config user.email "upstream-watch-bot@users.noreply.github.com"
          git add .github/state/claude-code-releases.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update claude-code-releases index"
          # Retry on push race (another workflow pushed mid-run)
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push race on attempt $attempt — pulling and retrying"
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts"
          exit 1
